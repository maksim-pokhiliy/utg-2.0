<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/fonts.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/colors.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/typography.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/spacing.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/base.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/components.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/styles.css">
  <script>(function(){var u="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/_ds_bundle.js";function go(){var s=document.createElement("script");s.src=u;document.head.appendChild(s);}if(window.React){go();}else{var n=0,t=setInterval(function(){if(window.React||++n>500){clearInterval(t);go();}},20);}})();</script>
  <script src="../data/catalog.js"></script>
  <style>header a img{height:38px !important}</style>
</helmet>
<div id="about" style="min-height:100vh;display:flex;flex-direction:column;background:var(--paper)">
  <x-import component-from-global-scope="UTGDesignSystem_62bf00.Header" locale="{{ locale }}" on-locale-change="{{ setLocale }}" logo-src="../../assets/logo-640.png" sticky="{{ true }}" nav="{{ navLinks }}" on-cart-click="{{ openCart }}" cart-count="{{ cartCount }}" hint-size="100%,64px"></x-import>
  <main style="flex:1 1 auto">
    <section class="utg-band" data-screen-label="About band">
      <div style="max-width:var(--container);margin:0 auto">
        <h1>{{ bandTitle }}</h1>
      </div>
    </section>
    <section data-screen-label="About text" style="padding:var(--space-6) var(--gutter) var(--space-9)">
      <div style="max-width:var(--container);margin:0 auto">
        <div style="max-width:760px;display:flex;flex-direction:column;gap:var(--space-5)">
          <p style="margin:0;font:var(--type-body);color:var(--ink);text-wrap:pretty">{{ p1 }}</p>
          <sc-if value="{{ useProposed }}" hint-placeholder-val="{{ true }}">
            <p style="margin:0;font:var(--type-body);color:var(--ink);text-wrap:pretty">{{ p2Base }} {{ propPre }}<a href="{{ reportsLink }}" style="color:var(--secondary)">{{ propLink }}</a>.</p>
          </sc-if>
          <sc-if value="{{ useLive }}" hint-placeholder-val="{{ false }}">
            <p style="margin:0;font:var(--type-body);color:var(--ink);text-wrap:pretty">{{ p2Live }}</p>
          </sc-if>
          <span style="display:block;max-width:520px;border:var(--rule) solid var(--ink);background:#fff;margin-top:var(--space-2)">
            <img src="../../assets/no_commercial.jpg" alt="" loading="lazy" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block">
          </span>
        </div>
      </div>
    </section>
  </main>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="UTGDesignSystem_62bf00.Footer" locale="{{ locale }}" nav="{{ navLinks }}" hint-size="100%,280px"></x-import></sc-if>
  <x-import component-from-global-scope="UTGCart.Drawer" from="../cart/cart-drawer.js" locale="{{ locale }}" open="{{ cartOpen }}" on-close="{{ closeCart }}" catalog-href="{{ drawerCatalogHref }}" checkout-href="{{ drawerCheckoutHref }}" hint-size="0px,0px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;locale&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;uk&quot;, &quot;en&quot;], &quot;default&quot;: &quot;uk&quot;, &quot;tsType&quot;: &quot;\&quot;uk\&quot; | \&quot;en\&quot;&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;closingLine&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;proposed&quot;, &quot;live&quot;], &quot;default&quot;: &quot;proposed&quot;, &quot;tsType&quot;: &quot;\&quot;proposed\&quot; | \&quot;live\&quot;&quot;, &quot;section&quot;: &quot;Proposed copy&quot;}
}">
class Component extends DCLogic {
  state = { locale: null, cartOpen: false };
  componentDidMount() {
    const sub = () => { this._unsub = window.UTG_CATALOG.cart.subscribe(() => this.forceUpdate()); };
    if (window.UTG_CATALOG) sub();
    else this._t = setInterval(() => { if (window.UTG_CATALOG) { clearInterval(this._t); sub(); this.forceUpdate(); } }, 25);
  }
  componentWillUnmount() { clearInterval(this._t); this._unsub && this._unsub(); }
  renderVals() {
    const C = window.UTG_CATALOG;
    this._hash = this._hash || Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
    const hashLang = this._hash.lang === "en" || this._hash.lang === "uk" ? this._hash.lang : null;
    const locale = this.state.locale ?? hashLang ?? this.props.locale ?? "uk";
    const d = C ? C.dict[locale] : {};
    const proposed = (this.props.closingLine ?? "proposed") === "proposed";
    return {
      locale,
      setLocale: (l) => { if (C) C.setHash({ lang: l }); this.setState({ locale: l }); },
      navLinks: C ? C.navLinks(locale) : null,
      ready: !!C,
      cartCount: C ? C.cart.count() : 0,
      cartOpen: !!this.state.cartOpen,
      openCart: () => this.setState({ cartOpen: true }),
      closeCart: () => this.setState({ cartOpen: false }),
      drawerCatalogHref: C ? C.catalogHref(locale) : "#",
      drawerCheckoutHref: C ? C.checkoutHref(locale) : "#",
      bandTitle: d.about ?? "",
      p1: d.aboutP1 ?? "",
      p2Live: d.aboutP2Live ?? "",
      p2Base: d.aboutP2Base ?? "",
      propPre: d.aboutPropPre ?? "",
      propLink: d.aboutPropLink ?? "",
      reportsLink: C ? C.reportsHref(locale) : "#",
      useProposed: !!C && proposed,
      useLive: !!C && !proposed,
    };
  }
}
</script>
</body>
</html>
