<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/fonts.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/colors.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/typography.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/spacing.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/base.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/tokens/components.css">
  <link rel="stylesheet" href="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/styles.css">
  <script>(function(){var u="../../_ds/utg-design-system-62bf007e-1ea9-45bc-a40a-f64544314e8c/_ds_bundle.js";function go(){var s=document.createElement("script");s.src=u;document.head.appendChild(s);}if(window.React){go();}else{var n=0,t=setInterval(function(){if(window.React||++n>500){clearInterval(t);go();}},20);}})();</script>
  <script src="../data/catalog.js"></script>
  <style>header a img{height:38px !important}</style>
</helmet>
<div id="reports" style="min-height:100vh;display:flex;flex-direction:column;background:var(--paper)">
  <x-import component-from-global-scope="UTGDesignSystem_62bf00.Header" locale="{{ locale }}" on-locale-change="{{ setLocale }}" logo-src="../../assets/logo-640.png" sticky="{{ true }}" nav="{{ navLinks }}" on-cart-click="{{ openCart }}" cart-count="{{ cartCount }}" hint-size="100%,64px"></x-import>
  <main style="flex:1 1 auto">
    <section class="utg-band" data-screen-label="Reports band">
      <div style="max-width:var(--container);margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:var(--space-2) var(--space-4)">
        <h1>{{ bandTitle }}</h1>
        <span style="font:var(--type-caption);letter-spacing:var(--caps-tracking);text-transform:uppercase;color:var(--band-muted)">{{ metaCaption }}</span>
      </div>
    </section>
    <section data-screen-label="Report photos" style="padding:var(--space-6) var(--gutter) var(--space-9)">
      <div style="max-width:var(--container);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6)">
        <p style="margin:0;font:var(--type-body);color:var(--ink-soft);max-width:46ch;text-wrap:pretty">{{ intro }}</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:var(--space-5) var(--space-5)">
          <sc-for list="{{ reports }}" as="r" hint-placeholder-count="8">
            <figure style="margin:0;display:flex;flex-direction:column;gap:var(--space-3)">
              <button type="button" id="report-fig-{{ r.index }}" aria-label="{{ r.ariaLabel }}" onClick="{{ r.open }}" style="display:block;width:100%;padding:0;aspect-ratio:1/1;border:var(--rule) solid var(--ink);background:#fff;overflow:hidden;cursor:pointer" style-focus="outline:2px solid var(--secondary);outline-offset:2px">
                <img src="{{ r.image }}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform var(--dur) var(--ease)" style-hover="transform:scale(1.03)">
              </button>
              <figcaption style="display:flex;align-items:baseline;gap:var(--space-3);font:var(--type-caption);letter-spacing:var(--caps-tracking);text-transform:uppercase">
                <span style="color:var(--ink-faint);flex:none">{{ r.index }}</span>
                <sc-if value="{{ r.hasCaption }}" hint-placeholder-val="{{ false }}"><span style="color:var(--ink);text-wrap:pretty">{{ r.caption }}</span></sc-if>
              </figcaption>
            </figure>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="UTGDesignSystem_62bf00.Footer" locale="{{ locale }}" nav="{{ navLinks }}" hint-size="100%,280px"></x-import></sc-if>
  <x-import component-from-global-scope="UTGCart.Drawer" from="../cart/cart-drawer.js" locale="{{ locale }}" open="{{ cartOpen }}" on-close="{{ closeCart }}" catalog-href="{{ drawerCatalogHref }}" checkout-href="{{ drawerCheckoutHref }}" hint-size="0px,0px"></x-import>
  <sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="Report lightbox" style="position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:var(--space-4)">
      <div onClick="{{ lbClose }}" style="position:absolute;inset:0;background:rgba(24,21,18,.5)"></div>
      <div role="dialog" aria-modal="{{ true }}" aria-label="{{ lbAria }}" style="position:relative;width:min(92vw,880px);max-height:92vh;display:flex;flex-direction:column;border:var(--rule) solid var(--ink);background:var(--paper)">
        <div style="display:flex;align-items:center;gap:var(--space-2);background:var(--band);color:var(--band-foreground);padding:6px 6px 6px 16px;min-height:56px">
          <span style="flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:var(--space-3);font:var(--type-caption);letter-spacing:var(--caps-tracking);text-transform:uppercase">
            <span style="color:var(--band-muted);flex:none">{{ lbIndex }}</span>
            <sc-if value="{{ lbHasCaption }}" hint-placeholder-val="{{ false }}"><span style="text-wrap:pretty">{{ lbCaption }}</span></sc-if>
          </span>
          <button type="button" aria-label="{{ prevLabel }}" onClick="{{ lbPrev }}" disabled="{{ lbPrevDisabled }}" style="{{ lbPrevStyle }}" style-hover="background:var(--paper);color:var(--ink)" style-focus="outline:2px solid var(--paper);outline-offset:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="{{ nextLabel }}" onClick="{{ lbNext }}" disabled="{{ lbNextDisabled }}" style="{{ lbNextStyle }}" style-hover="background:var(--paper);color:var(--ink)" style-focus="outline:2px solid var(--paper);outline-offset:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
          <button type="button" aria-label="{{ closeLabel }}" onClick="{{ lbClose }}" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:0;background:transparent;color:var(--band-foreground);cursor:pointer" style-hover="background:var(--paper);color:var(--ink)" style-focus="outline:2px solid var(--paper);outline-offset:2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
        </div>
        <div onTouchStart="{{ lbTouchStart }}" onTouchEnd="{{ lbTouchEnd }}" style="background:#fff;min-height:0">
          <img src="{{ lbImage }}" alt="{{ lbAria }}" loading="lazy" style="display:block;width:100%;height:auto;max-height:calc(92vh - 56px);object-fit:contain">
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;locale&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;uk&quot;, &quot;en&quot;], &quot;default&quot;: &quot;uk&quot;, &quot;tsType&quot;: &quot;\&quot;uk\&quot; | \&quot;en\&quot;&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;demoLightbox&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;closed&quot;, &quot;1&quot;, &quot;3&quot;], &quot;default&quot;: &quot;closed&quot;, &quot;tsType&quot;: &quot;\&quot;closed\&quot; | \&quot;1\&quot; | \&quot;3\&quot;&quot;, &quot;section&quot;: &quot;Design review&quot;}
}">
class Component extends DCLogic {
  state = { locale: null, cartOpen: false, lb: null };
  componentDidMount() {
    const sub = () => { this._unsub = window.UTG_CATALOG.cart.subscribe(() => this.forceUpdate()); };
    if (window.UTG_CATALOG) sub();
    else this._t = setInterval(() => { if (window.UTG_CATALOG) { clearInterval(this._t); sub(); this.forceUpdate(); } }, 25);
    this._onKey = (e) => {
      if (this.state.lb == null) return;
      if (e.key === "Escape") this.closeLb();
      else if (e.key === "ArrowLeft") this.stepLb(-1);
      else if (e.key === "ArrowRight") this.stepLb(1);
    };
    window.addEventListener("keydown", this._onKey);
    const demo = this.props.demoLightbox ?? "closed";
    if (demo !== "closed") this._demoT = setTimeout(() => this.openLb(parseInt(demo, 10) - 1), 400);
  }
  componentWillUnmount() {
    clearInterval(this._t); this._unsub && this._unsub();
    window.removeEventListener("keydown", this._onKey);
    clearTimeout(this._demoT);
    document.body.style.overflow = "";
  }
  openLb(i) {
    this._opener = document.activeElement;
    document.body.style.overflow = "hidden";
    this.setState({ lb: i });
  }
  closeLb() {
    document.body.style.overflow = "";
    this.setState({ lb: null });
    const op = this._opener;
    if (op && op.focus) setTimeout(() => op.focus(), 30);
  }
  stepLb(d) {
    this.setState((s) => (s.lb == null ? null : { lb: Math.max(0, Math.min(7, s.lb + d)) }));
  }
  renderVals() {
    const C = window.UTG_CATALOG;
    this._hash = this._hash || Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
    const hashLang = this._hash.lang === "en" || this._hash.lang === "uk" ? this._hash.lang : null;
    const locale = this.state.locale ?? hashLang ?? this.props.locale ?? "uk";
    const d = C ? C.dict[locale] : {};
    const reports = C ? C.reports(locale) : [];
    return {
      locale,
      setLocale: (l) => { if (C) C.setHash({ lang: l }); this.setState({ locale: l }); },
      navLinks: C ? C.navLinks(locale) : null,
      ready: !!C,
      cartCount: C ? C.cart.count() : 0,
      cartOpen: !!this.state.cartOpen,
      openCart: () => this.setState({ cartOpen: true }),
      closeCart: () => this.setState({ cartOpen: false }),
      drawerCatalogHref: C ? C.catalogHref(locale) : "#",
      drawerCheckoutHref: C ? C.checkoutHref(locale) : "#",
      bandTitle: d.reports ?? "",
      metaCaption: reports.length ? "01–" + reports[reports.length - 1].index : "",
      intro: d.reportsIntro ?? "",
      reports: reports.map((r, i) => ({
        image: r.image, index: r.index, caption: r.caption ?? "", hasCaption: !!r.caption,
        ariaLabel: (d.reports ?? "") + " " + r.index + (r.caption ? " — " + r.caption : ""),
        open: () => this.openLb(i),
      })),
      ...this.lightboxVals(reports, d),
    };
  }
  lightboxVals(reports, d) {
    const i = this.state.lb;
    const navBtn = (disabled) => ({
      display: "inline-flex", alignItems: "center", justifyContent: "center",
      width: "44px", height: "44px", flex: "none", border: "0",
      background: "transparent", color: "var(--band-foreground)",
      cursor: disabled ? "default" : "pointer", opacity: disabled ? ".35" : "1",
      pointerEvents: disabled ? "none" : "auto",
    });
    if (i == null || !reports.length) {
      return { lbOpen: false, lbIndex: "", lbCaption: "", lbHasCaption: false, lbAria: "", lbImage: "", lbPrev: () => {}, lbNext: () => {}, lbClose: () => {}, lbPrevDisabled: true, lbNextDisabled: true, lbPrevStyle: navBtn(true), lbNextStyle: navBtn(true), lbTouchStart: () => {}, lbTouchEnd: () => {}, prevLabel: "", nextLabel: "", closeLabel: d.close ?? "" };
    }
    const r = reports[i];
    const atStart = i === 0, atEnd = i === reports.length - 1;
    return {
      lbOpen: true,
      lbIndex: r.index,
      lbCaption: r.caption ?? "",
      lbHasCaption: !!r.caption,
      lbAria: (d.reports ?? "") + " " + r.index + (r.caption ? " — " + r.caption : ""),
      lbImage: r.image,
      lbClose: () => this.closeLb(),
      lbPrev: () => this.stepLb(-1),
      lbNext: () => this.stepLb(1),
      lbPrevDisabled: atStart,
      lbNextDisabled: atEnd,
      lbPrevStyle: navBtn(atStart),
      lbNextStyle: navBtn(atEnd),
      lbTouchStart: (e) => { this._tx = e.touches && e.touches[0] ? e.touches[0].clientX : null; },
      lbTouchEnd: (e) => {
        if (this._tx == null) return;
        const dx = (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : this._tx) - this._tx;
        this._tx = null;
        if (Math.abs(dx) > 40) this.stepLb(dx < 0 ? 1 : -1);
      },
      prevLabel: r.index === "01" ? "" : reports[i - 1].index,
      nextLabel: atEnd ? "" : reports[i + 1].index,
      closeLabel: d.close ?? "",
    };
  }
}
</script>
</body>
</html>
